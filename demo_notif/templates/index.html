<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Bot Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; background-color: #f8f9fa; }
        .chat-list { max-height: 400px; overflow-y: auto; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4 text-center">🤖 Telegram Bot Manager</h1>
        
        <div class="row">
            <!-- Form Card -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">ส่งข้อความ</h5>
                    </div>
                    <div class="card-body">
                        {% if message %}
                            <div class="alert alert-{{ msg_type }}">{{ message }}</div>
                        {% endif %}
                        
                        <form action="/send" method="POST">
                            <div class="mb-3">
                                <label for="chat_id" class="form-label">Chat ID ปลายทาง</label>
                                <input type="text" class="form-control" id="chat_id" name="chat_id" required placeholder="เลือกจากรายการขวา หรือใส่เอง">
                            </div>
                            <div class="mb-3">
                                <label for="text" class="form-label">ข้อความ</label>
                                <textarea class="form-control" id="text" name="text" rows="4" required placeholder="พิมพ์ข้อความที่นี่..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-success w-100">ส่งข้อความ</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- List Card -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0">รายชื่อที่บันทึกไว้ ({{ chats|length }})</h5>
                    </div>
                    <div class="card-body p-0 chat-list">
                        {% if chats %}
                            <div class="list-group list-group-flush">
                            {% for id, info in chats.items() %}
                                <button type="button" class="list-group-item list-group-item-action" 
                                        onclick="document.getElementById('chat_id').value='{{ id }}'">
                                    <div class="d-flex w-100 justify-content-between">
                                        <h6 class="mb-1">{{ info.name }}</h6>
                                        <small class="text-muted">{{ info.type }}</small>
                                    </div>
                                    <small class="text-secondary">ID: {{ id }}</small>
                                </button>
                            {% endfor %}
                            </div>
                        {% else %}
                            <p class="text-center p-3 text-muted">ยังไม่มีข้อมูล (ลองทักบอทมาก่อน)</p>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
        
        <div class="text-center mt-4 text-muted">
            <small>Webhook URL: {{ webhook_url }}</small>
        </div>
    </div>
</body>
</html>
